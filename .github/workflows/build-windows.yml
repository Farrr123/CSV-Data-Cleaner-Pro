
name: Build Windows EXE and Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name CSVDataCleaner CSV_Cleaner_APP/csv_data_cleaner_pro.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CSVDataCleaner-Windows
          path: dist/CSVDataCleaner.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/CSVDataCleaner.exe
