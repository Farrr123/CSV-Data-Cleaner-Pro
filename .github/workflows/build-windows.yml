
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name CSVDataCleaner CSV_Cleaner_APP/csv_data_cleaner_pro.py
        working-directory: .

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CSVDataCleaner-Windows
          path: dist/CSVDataCleaner.exe
          if-no-files-found: error
